[workspace]
resolver = "3"
members = [
    "crates/stencil-core",
    "crates/stencil-mask",
    "crates/stencil-secrets",
    "crates/stencil-browser",
    "crates/stencil-places",
    "crates/apiwright",
    "crates/stencilwright",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process", "signal", "time", "sync", "net"] }

# Serialization (TOML artifacts: places.toml, elements.toml, mask.toml, values.toml)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.23"

# Masking primitives
regex = "1"
sha2 = "0.11"
hex = "0.4"
lol_html = "2"

# Errors / logging / paths
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"

# CLI
clap = { version = "4", features = ["derive"] }
iced = "0.13.1"

# Browser transport (per spec §5)
playwright-rs = "0.12"

# Unix syscalls used by the daemon (flock, kill, setsid).
libc = "0.2"

# Test-only
tempfile = "3"

# Internal crate refs
stencil-core    = { path = "crates/stencil-core" }
stencil-mask    = { path = "crates/stencil-mask" }
stencil-secrets = { path = "crates/stencil-secrets" }
stencil-browser = { path = "crates/stencil-browser" }
stencil-places  = { path = "crates/stencil-places" }
