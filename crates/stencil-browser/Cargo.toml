[package]
name = "stencil-browser"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Playwright-rs wrapper, session daemon, Unix-socket RPC, masked Page API."

[features]
# Compile-time gate for unmasked DOM access. Enabled only by
# apiwright and downstream production-adapter crates.
raw = []
approval-dialog = ["dep:iced"]

[dependencies]
stencil-core    = { workspace = true }
stencil-mask    = { workspace = true }
stencil-secrets = { workspace = true }
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }
playwright-rs = { workspace = true }
libc        = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
iced        = { workspace = true, optional = true, features = ["image"] }

[dev-dependencies]
tempfile = { workspace = true }
